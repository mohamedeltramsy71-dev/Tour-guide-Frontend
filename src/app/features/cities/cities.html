<!-- Hero Slider -->
<section class="cities-slider position-relative">
  <div class="slider-wrapper">
    <div class="slide" *ngFor="let slide of slides; let i = index" [class.active]="i === currentSlide">
      <img [src]="slide.image" [alt]="slide.title" class="slide-img">
      <div class="slide-overlay">
        <div class="slide-content text-white text-center px-3">
          <h2 class="fw-bold slide-title">{{ slide.title }}</h2>
          <p class="slide-subtitle opacity-75">{{ slide.subtitle }}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Dots -->
  <div class="slider-dots">
    <span *ngFor="let slide of slides; let i = index"
      class="dot" [class.active]="i === currentSlide"
      (click)="goToSlide(i)">
    </span>
  </div>

  <!-- Search Bar -->
  <div class="search-overlay position-absolute start-50 translate-middle-x w-100">
    <div class="container">
      <div class="search-box bg-white rounded-4 shadow-lg px-3 px-md-4 py-2 py-md-3 d-flex align-items-center gap-2 gap-md-3">
        <i class="fas fa-search text-muted flex-shrink-0"></i>
        <input
          type="text"
          class="form-control border-0 shadow-none search-input"
          placeholder="Search cities..."
          [(ngModel)]="searchQuery"
          (ngModelChange)="onSearch()">
        <span class="cities-badge badge rounded-pill px-2 px-md-3 py-2 flex-shrink-0"
              style="background-color: var(--primary);">
          {{ filteredCities.length }} Cities
        </span>
      </div>
    </div>
  </div>
</section>

<!-- Cities Grid -->
<section class="cities-section py-4 py-md-5" style="background-color: var(--light-bg);">
  <div class="container">
    <div class="row g-3 g-md-4">
      <div class="col-6 col-md-4 col-lg-3" *ngFor="let city of filteredCities">
        <div class="city-card card border-0 shadow-sm rounded-4 overflow-hidden h-100"
          [routerLink]="['/cities', city.id]" style="cursor:pointer;">
          <div class="position-relative">
            <img [src]="city.imageUrl" [alt]="city.nameEn" class="card-img-top city-img">
            <div class="city-overlay position-absolute top-0 start-0 w-100 h-100 d-flex align-items-end p-2 p-md-3">
              <div class="text-white">
                <h5 class="fw-bold mb-0 city-name">{{ city.nameEn }}</h5>
                <small class="opacity-75">{{ city.nameAr }}</small>
              </div>
            </div>
          </div>
          <div class="card-body p-2 p-md-3">
            <p class="text-muted small mb-2 city-desc d-none d-md-block">{{ city.description | slice:0:80 }}...</p>
            <div class="d-flex justify-content-between align-items-center">
              <small class="text-muted landmarks-label">
                <i class="fas fa-map-marker-alt me-1" style="color: var(--primary);"></i>
                <span class="d-none d-sm-inline">{{ city.landmarksCount }} Landmarks</span>
                <span class="d-sm-none">{{ city.landmarksCount }}</span>
              </small>
              <span class="btn btn-sm text-white px-2 px-md-3 explore-btn" style="background-color: var(--primary);">
                Explore →
              </span>
            </div>
          </div>
        </div>
      </div>

      <!-- Empty State -->
      <div class="col-12 text-center py-5" *ngIf="filteredCities.length === 0">
        <i class="fas fa-search fa-3x text-muted mb-3"></i>
        <h5 class="text-muted">No cities found</h5>
        <p class="text-muted">Try searching with a different keyword</p>
      </div>
    </div>
  </div>
</section>
