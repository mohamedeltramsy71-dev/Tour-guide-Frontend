<div class="register-select-wrapper">
    <!-- Background Image -->
    <img src="images/auth/auth.png" alt="Rihla" class="bg-img">

    <!-- Overlay -->
    <div class="overlay">
        <div class="content">

            <!-- Logo -->
            <div class="text-center mb-4">
                <img src="images/logo.png" alt="Rihla Logo" height="80" class="mb-2">
                <h2 class="fw-bold" style="color: var(--gold);">RIHLA</h2>
            </div>

            <!-- Card -->
            <div class="form-card">

                <!-- Icon -->
                <div class="icon-wrapper mb-3">
                    <i class="fas fa-lock"></i>
                </div>

                <!-- Header -->
                <h3 class="fw-bold mb-1" style="color: var(--dark);">Forgot Password?</h3>
                <p class="text-muted mb-4">Enter your email and we'll send you a reset link</p>

                <!-- Success -->
                <div class="alert alert-success rounded-3" *ngIf="successMessage">
                    <i class="fas fa-check-circle me-2"></i>{{ successMessage }}
                </div>

                <!-- Error -->
                <div class="alert alert-danger rounded-3" *ngIf="errorMessage">
                    <i class="fas fa-exclamation-circle me-2"></i>{{ errorMessage }}
                </div>

                <!-- Email -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">Email Address</label>
                    <div class="input-group-custom">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" class="form-control custom-input"
                            placeholder="Enter your email" [(ngModel)]="email">
                    </div>
                </div>

                <!-- Send Button -->
                <button class="btn w-100 text-white py-3 mb-3 rounded-3 fw-bold"
                    style="background-color: var(--primary);"
                    (click)="onSubmit()" [disabled]="isLoading">
                    <span *ngIf="!isLoading">Send Reset Link <i class="fas fa-paper-plane ms-2"></i></span>
                    <span *ngIf="isLoading">
                        <span class="spinner-border spinner-border-sm me-2"></span>Sending...
                    </span>
                </button>

                <!-- Back to Login -->
                <div class="text-center">
                    <a routerLink="/auth/login" class="back-link">
                        <i class="fas fa-arrow-left me-2"></i>Back to Login
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>
