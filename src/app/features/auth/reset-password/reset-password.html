<div class="register-select-wrapper">
    <!-- Background Image -->
    <img src="images/auth/auth.png" alt="Rihla" class="bg-img">

    <!-- Overlay -->
    <div class="overlay">
        <div class="content">

            <!-- Logo -->
            <div class="text-center mb-4">
                <img src="images/logo.png" alt="Rihla Logo" height="80" class="mb-2">
                <h2 class="fw-bold" style="color: var(--gold);">RIHLA</h2>
            </div>

            <!-- Card -->
            <div class="form-card">

                <!-- Icon -->
                <div class="icon-wrapper mb-3">
                    <i class="fas fa-key"></i>
                </div>

                <!-- Header -->
                <h3 class="fw-bold mb-1" style="color: var(--dark);">Reset Password</h3>
                <p class="text-muted mb-4">Enter your new password below</p>

                <!-- Success -->
                <div class="alert alert-success rounded-3" *ngIf="successMessage">
                    <i class="fas fa-check-circle me-2"></i>{{ successMessage }}
                </div>

                <!-- Error -->
                <div class="alert alert-danger rounded-3" *ngIf="errorMessage">
                    <i class="fas fa-exclamation-circle me-2"></i>{{ errorMessage }}
                </div>

                <!-- Invalid Link -->
                <div class="alert alert-warning rounded-3" *ngIf="invalidLink">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    Invalid or expired reset link. Please request a new one.
                    <div class="mt-2">
                        <a routerLink="/auth/forgot-password" style="color: var(--primary);">Request new link</a>
                    </div>
                </div>

                <div *ngIf="!invalidLink && !successMessage">
                    <!-- New Password -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">New Password</label>
                        <div class="input-group-custom">
                            <i class="fas fa-lock input-icon"></i>
                            <input [type]="showPassword ? 'text' : 'password'"
                                class="form-control custom-input"
                                placeholder="Enter new password" [(ngModel)]="newPassword">
                            <i class="fas input-icon-right" [class]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
                                (click)="togglePassword()" style="cursor:pointer;"></i>
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Confirm New Password</label>
                        <div class="input-group-custom">
                            <i class="fas fa-lock input-icon"></i>
                            <input [type]="showConfirmPassword ? 'text' : 'password'"
                                class="form-control custom-input"
                                placeholder="Confirm new password" [(ngModel)]="confirmPassword">
                            <i class="fas input-icon-right" [class]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"
                                (click)="toggleConfirmPassword()" style="cursor:pointer;"></i>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button class="btn w-100 text-white py-3 mb-3 rounded-3 fw-bold"
                        style="background-color: var(--primary);"
                        (click)="onSubmit()" [disabled]="isLoading">
                        <span *ngIf="!isLoading">Reset Password <i class="fas fa-check ms-2"></i></span>
                        <span *ngIf="isLoading">
                            <span class="spinner-border spinner-border-sm me-2"></span>Resetting...
                        </span>
                    </button>
                </div>

                <!-- Back to Login -->
                <div class="text-center">
                    <a routerLink="/auth/login" class="back-link">
                        <i class="fas fa-arrow-left me-2"></i>Back to Login
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>
